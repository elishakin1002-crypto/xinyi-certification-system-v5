server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 2026-09-02 去掉了 8080。
    #
    # 当初开它是因为我判断「同事那台电脑打不开」是运营商拦了未备案服务器的 80 端口。
    # 判断错了：真实原因是页面在等 fonts.googleapis.com 返回，
    # 那个域名在国内经常直接超时，浏览器最后报「无法访问此网站」。
    # 前端资源本地化之后问题就没了，8080 从未派上用场。
    #
    # 留着一个没人用的端口只是多一个对外的面。少开一个就少一个。
    server_name _;

    root /opt/xinyi/dist;
    index index.html;

    # 合同/知识库上传要走这里，和 API_JSON_LIMIT=25mb 对齐。
    # 不设的话 Nginx 默认 1M，传个 PDF 就 413，而且报错发生在 Nginx，
    # 后端日志里什么都看不到 —— 这种「一边报错一边没日志」最难查。
    client_max_body_size 25m;

    # 前端 JS 打包后 1.5MB，不压缩的话温州这边宽带要等好几秒
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # 微信域名验证文件（备案/公众号对接要用），必须能原样访问
    location = /ce4587ea3da80b01672edc6917fc674a.txt {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # AI 生成合同摘要这类请求最长 90 秒，默认 60 秒会在快出结果时掐断，
        # 用户看到的是「转圈很久然后失败」，比直接报错更让人不知所措。
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
        proxy_buffering off;
    }

    # 带 hash 的构建产物，改一次内容文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存 —— 缓存了的话重新部署后同事still拿到旧版本，
    # 而且他自己刷新也没用，只能清缓存，等于每次上线都要挨个教一遍
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # HashRouter 的前端路由，所有未知路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
