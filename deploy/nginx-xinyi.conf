server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 2026-09-02 去掉了 8080。
    #
    # 当初开它是因为我判断「同事那台电脑打不开」是运营商拦了未备案服务器的 80 端口。
    # 判断错了：真实原因是页面在等 fonts.googleapis.com 返回，
    # 那个域名在国内经常直接超时，浏览器最后报「无法访问此网站」。
    # 前端资源本地化之后问题就没了，8080 从未派上用场。
    #
    # 留着一个没人用的端口只是多一个对外的面。少开一个就少一个。
    server_name _;

    root /opt/xinyi/dist;
    index index.html;

    # 合同/知识库上传要走这里，和 API_JSON_LIMIT=25mb 对齐。
    # 不设的话 Nginx 默认 1M，传个 PDF 就 413，而且报错发生在 Nginx，
    # 后端日志里什么都看不到 —— 这种「一边报错一边没日志」最难查。
    client_max_body_size 25m;

    # 前端 JS 打包后 1.5MB，不压缩的话温州这边宽带要等好几秒
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # 微信域名验证文件（备案/公众号对接要用），必须能原样访问
    # ══════════════════════════════════════════════════════════
    # 安全加固（2026-09-08）
    # ══════════════════════════════════════════════════════════
    #
    # **这段必须写在仓库里，不能只在服务器上改。**
    # 我第一次是直接 ssh 上去改 /etc/nginx/sites-available/xinyi，
    # 结果下一次 deploy.sh 第 4 步重新下发配置，加固全部被覆盖回去 ——
    # 而且悄无声息：部署自检只看首页 200，看不出扫描器防护没了。
    #
    # ── 为什么要挡扫描器 ──────────────────────────────────────
    # 腾讯云主机安全每天报一堆「攻击检测」，打的全是 WordPress、
    # PHPUnit（CVE-2017-9841）、ThinkPHP 这些 PHP 漏洞 —— 本站没有 PHP，
    # 一条都得不了手。但 SPA 兜底 try_files 会把**任何**不存在的路径
    # 回成 index.html + 200，实测 244 次探测全是 200，
    # 扫描器据此认定「这台有反应」，于是持续回来加量扫。
    # 444 = 直接关闭连接，一个字节都不回，最不像「有戏」。
    #
    # ⚠️ 加规则前必须确认它不命中 /opt/xinyi/dist 下真实存在的路径。
    # 第一版写了裸的 `/vendor/`，把本站自己的 tailwind/xlsx/pdf/mammoth
    # 全掐了，页面样式和导出功能挂了 38 分钟，当时还有人在用。
    location ~* (\.php[0-9]?$|\.aspx?$|\.jsp$|\.cgi$|/\.env|/wp-|/wordpress|/vendor/phpunit|/phpunit/|/eval-stdin|/\.git|/\.svn|/\.aws|/\.ssh|/phpmyadmin|/pma/|/mysqladmin|/think\\app|/cgi-bin/) {
        return 444;
    }

    # 版本号会告诉扫描器该拿哪个 CVE 来试
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location = /ce4587ea3da80b01672edc6917fc674a.txt {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # AI 生成合同摘要这类请求最长 90 秒，默认 60 秒会在快出结果时掐断，
        # 用户看到的是「转圈很久然后失败」，比直接报错更让人不知所措。
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
        proxy_buffering off;
    }

    # 带 hash 的构建产物，改一次内容文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存 —— 缓存了的话重新部署后同事still拿到旧版本，
    # 而且他自己刷新也没用，只能清缓存，等于每次上线都要挨个教一遍
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        # 下面三条是重复的，不是冗余：nginx 里子块只要自己写了 add_header，
        # 父块的全部失效 —— 不重写一遍，首页就一个安全头都没有。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # HashRouter 的前端路由，所有未知路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
