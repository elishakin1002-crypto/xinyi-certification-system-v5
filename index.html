
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>信义认证系统 V5.0</title>
    <!--
      这几个库以前是从 cdn.tailwindcss.com 和 cdnjs.cloudflare.com 拉的。
      改成本地是因为：从上海机房测 cdnjs 一个文件要 4.4 秒，同事在温州用家里宽带
      只会更慢。最坏情况不是「慢」而是「白板」—— Tailwind 没加载，整个页面没有样式；
      xlsx/pdf 没加载，合同解析静默失效，用的人只觉得「这功能坏了」。
      文件都在 public/vendor/，版本号写在 package.json 的注释里，升级要手动替换。
    -->
    <script src="/vendor/tailwind.min.js"></script>
    <script src="/vendor/mammoth.browser.min.js"></script>
    <script src="/vendor/xlsx.full.min.js"></script>
    <script src="/vendor/pdf.min.js"></script>
    <!-- Inter 只保留 latin/latin-ext 两个子集，136KB。
         中文不下载字体：Noto Sans SC 完整包好几 MB，而 Mac 有苹方、Windows 有微软雅黑，
         系统自带的中文字体本来就够好，为它等几秒不值得。 -->
    <link rel="stylesheet" href="/fonts/inter.css" />
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                     'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
                     'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        padding: 0;
      }
      /* Custom scrollbar for sidebar */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Markdown Professional Rendering Styles */
      .markdown-body {
        line-height: 1.6;
        word-wrap: break-word;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        font-weight: 700;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        color: inherit;
      }
      .markdown-body h3 { font-size: 1.1rem; }
      .markdown-body p { margin-bottom: 0.75rem; }
      .markdown-body ul, .markdown-body ol {
        padding-left: 1.25rem;
        margin-bottom: 0.75rem;
      }
      .markdown-body ul { list-style-type: disc; }
      .markdown-body ol { list-style-type: decimal; }
      .markdown-body li { margin-bottom: 0.25rem; }
      .markdown-body code {
        background-color: rgba(0,0,0,0.05);
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        font-family: monospace;
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1rem;
        font-size: 0.85rem;
      }
      .markdown-body th, .markdown-body td {
        border: 1px solid #e5e7eb;
        padding: 0.5rem;
        text-align: left;
      }
      .markdown-body th { background-color: #f9fafb; }
      
      /* Shake animation for notification bell */
      @keyframes shake {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(10deg); }
        75% { transform: rotate(-10deg); }
      }
      .group:hover .shake {
        animation: shake 0.5s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0"
  }
}
</script>
<!-- 原来这里有 <link rel="stylesheet" href="/index.css">，但仓库里从来没有这个文件，
     每次打开页面都白白 404 一次。删掉。 -->
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
