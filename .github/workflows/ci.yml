name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ── 为什么 CI 里要起一个真的 PostgreSQL（2026-09-18）────────────────
    #
    # 在这之前 CI 里没有任何数据库。后果不是"少测了一点"，是**测错了对象**：
    # tests/helpers/testDb.js 解析不到库地址时返回空串，于是所有用例整体落到
    # **文件回退路径**上 —— 而生产跑的是 PostgreSQL。两条完全不同的代码路径。
    #
    # 这次把测试真正跑起来之后，63 条用例当场 ECONNREFUSED（pg 拿到空连接串
    # 会去连默认的 localhost:5432）。挂掉其实是运气好 —— 它们要是"优雅降级"，
    # 就会一路假绿到上线那天。
    #
    # 版本钉死 16，和生产（腾讯云 PG 16）一致：版本不同的话，
    # CI 绿了也不代表生产不炸（排序规则、JSONB 行为、锁语义都可能不一样）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # 没有健康检查的话，后面的步骤会在库还没起来时就开始连，
        # 变成那种"偶尔红一次"的假故障 —— 比一直红更难查。
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 和生产、开发机保持同一个大版本（都是 v22）。
          # 2026-09-18 之前这里是 20 —— **CI 验的是一个没人用的运行时**，
          # 而且 Node 20 的 `node --test` 不支持 glob 展开，
          # 于是 "tests/**/*.test.js" 在这里永远找不到文件、测试一条都没跑过。
          # 版本声明在 package.json 的 engines 里，改这里之前先改那里。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 建 xinyi_test 并跑迁移。库名必须以 _test 结尾 ——
      # tests/helpers/testDb.js 会强制校验，这是"测试连上生产库"那次事故之后加的闸。
      - name: Prepare test database
        env:
          # 基准地址；脚本把库名换成 xinyi_test 后建库 + 迁移。
          XINYI_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:db:setup

      - name: Test
        env:
          # resolveTestDbUrl() 优先认这个，不用再从基准地址推导。
          XINYI_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/xinyi_test
          # 缺库时直接红，不许静悄悄退回文件回退路径（见 scripts/test-db-reset.mjs）。
          XINYI_REQUIRE_TEST_DB: '1'
        run: npm run test

      - name: Build
        run: npm run build

      - name: Frontend secret scan
        run: npm run security:bundle

      # 迁移文件静态检查（不连库）：文件名格式、版本号重复、空文件、整库级危险语句。
      # 放在 CI 是因为这类错误漏到部署那一刻才炸，代价比在这里拦下来大得多。
      - name: Migration files lint
        run: npm run migrate:lint

      # 权限矩阵体检：路由守卫覆盖 + 角色×页面矩阵 + 敏感元素权限门。
      # 加这一步是因为越权问题此前全靠人工逐个发现，容易漏。
      - name: Permission matrix check
        run: npm run health:permissions

      - name: Deploy preflight (test profile)
        env:
          XINYI_REQUIRE_POSTGRES: "true"
          XINYI_AUTH_REQUIRE_POSTGRES: "true"
          DATABASE_URL: postgres://dummy:dummy@db.example.test:5432/dummy
          PGSSLMODE: require
          KIMI_API_KEY: ci-kimi-key-placeholder
          XINYI_API_AUTH_TOKEN: ci-token-for-preflight-check
          AUTH_SMOKE_ACCOUNT: admin@example.test
          AUTH_SMOKE_PASSWORD: admin-pass-123
          XINYI_SESSION_AUTH_REQUIRED: "1"
          XINYI_SESSION_ROLE_ENFORCEMENT: "1"
          XINYI_SESSION_COOKIE_SECURE: "1"
          CORS_ALLOWED_ORIGINS: https://example.test
          VITE_AI_BACKEND_URL: /api/ai
          VITE_AUTH_REQUIRED: "1"
          VITE_INTEL_LOCAL_FALLBACKS_ENABLED: "0"
          VITE_STATE_SYNC_ENABLED: "1"
          VITE_LEADS_API_ENABLED: "1"
          VITE_LEADS_API_READ_ENABLED: "1"
          VITE_LEADS_API_VERIFY_WRITES_ENABLED: "1"
          VITE_CUSTOMERS_API_ENABLED: "1"
          VITE_CUSTOMERS_API_READ_ENABLED: "1"
          VITE_CUSTOMERS_API_VERIFY_WRITES_ENABLED: "1"
          VITE_CONTRACTS_API_READ_ENABLED: "1"
          VITE_CONTRACTS_API_WRITE_ENABLED: "1"
          VITE_CONTRACTS_API_VERIFY_WRITES_ENABLED: "1"
          VITE_PROJECTS_API_READ_ENABLED: "1"
          VITE_PROJECTS_API_WRITE_ENABLED: "1"
          VITE_PROJECTS_API_VERIFY_WRITES_ENABLED: "1"
        run: npm run health:preflight:test

      # 字段契约：前端字段↔库表列的映射、核心实体的字段名，都固化在
      # tests/fixtures/data-contract.json。改名或删字段会在这里红 ——
      # 不是禁止改，是不许**悄悄**改（改动必须出现在 diff 里）。
      # 加这一步是因为：类型检查和测试都挡不住"两边一起改"的字段改名，
      # 而线上库里的旧数据是按旧名字存的。
      - name: Data contract check
        run: node --test tests/data-contract.test.js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # e2e 用的是**另一个**库（playwright.config.ts 里的 xinyi_e2e_test），
      # 和单元测试的 xinyi_test 分开，免得两边互相清数据。
      - name: Prepare e2e database
        env:
          XINYI_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
          XINYI_TEST_DB_NAME: xinyi_e2e_test
        run: npm run test:db:setup

      - name: E2E smoke
        env:
          # 不设的话 playwright.config.ts 会退到默认的 postgres://postgres@localhost/xinyi_dev，
          # 那个地址在 CI 里没有密码、库也不存在。
          E2E_DB_URL: postgres://postgres:postgres@localhost:5432/xinyi_e2e_test
        run: npm run e2e
